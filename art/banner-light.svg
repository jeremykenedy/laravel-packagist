<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
    <title id="title">Laravel Packagist</title>
    <desc id="description">Package details, vendor statistics, and Laravel caching.</desc>
    <rect width="800" height="200" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="40" y="80" font-size="40" font-weight="700" letter-spacing="-.5" fill="#0f172a">Laravel Packagist</text>
        <text x="40" y="112" font-size="14" fill="#64748b">Packagist data, ready for your Laravel application.</text>
